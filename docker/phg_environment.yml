name: phgv2-conda
channels:
  - conda-forge
  - bioconda
# These constraints intentionally mirror PHGv2's own phg_environment.yml but
# are loosened enough to resolve on both linux-64 and linux-aarch64:
#
# - anchorwave 1.2.5 has no linux-aarch64 build on bioconda (only 1.2.6+).
#   Using >=1.2.5 lets arm64 builds pick 1.2.6 automatically.
# - agc 3.1 and ropebwt3 3.8 both have aarch64 builds, but we loosen them
#   here too so the solver isn't forced to exact patch versions when a
#   compatible newer one would satisfy PHG.
# - minimap2 2.28 has linux-64 and osx builds; use >= so aarch64 works.
dependencies:
  - python=3.12
  - anchorwave>=1.2.5
  - bcftools
  - samtools
  - agc>=3.1
  - ropebwt3>=3.8
  - minimap2>=2.28
  # Python deps needed by the MLImpute scripts that back pick_crossovers,
  # convert_coordinates, and generate_recombined_sequences. They live in
  # the seq-sim pixi env, but inside the container SEQ_SIM_SKIP_PIXI_PREFIX=1
  # routes those calls through this conda env directly, so the deps must
  # be present here too.
  - numpy
  - pandas
  - pysam
  - crossmap
  # Native CLI deps used by create_chain_files / format_recombined_fastas.
  - seqkit
  - parallel
